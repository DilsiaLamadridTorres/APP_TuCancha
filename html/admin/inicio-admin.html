<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Panel Administrativo | TuCancha</title>


    <!-- Favicon -->
    <link
        rel="icon"
        type="image/png"
        href="../../img/logo/logo corto.png"
    >


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >


    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- CSS del panel administrativo -->
    <link
        rel="stylesheet"
        href="../../css/admin/inicio-admin.css"
    >

</head>


<body>


    <!-- =====================================================
         PANEL ADMINISTRATIVO
         ===================================================== -->

    <div class="admin-layout">


        <!-- =================================================
             SIDEBAR
             ================================================= -->

        <aside class="admin-sidebar">


            <!-- =============================================
                 LOGO
                 ============================================= -->

            <div class="sidebar-brand">

                <img
                    src="../../img/logo/Logo.png"
                    alt="Logo TuCancha"
                    class="sidebar-logo"
                >


                <div class="sidebar-brand-text">

                    <strong>
                        TuCancha
                    </strong>

                    <span>
                        Panel Administrativo
                    </span>

                </div>

            </div>



            <!-- =============================================
                 NAVEGACIÓN
                 ============================================= -->

            <nav class="sidebar-nav">


                <!-- Inicio -->

                <a
                    href="inicio-admin.html"
                    class="sidebar-link active"
                >

                    <i class="bi bi-house-door-fill"></i>

                    <span>
                        Inicio
                    </span>

                </a>



                <!-- Solicitudes -->

                <a
                    href="../dashboard_admin.html"
                    class="sidebar-link"
                >

                    <i class="bi bi-file-earmark-text"></i>

                    <span>
                        Solicitudes
                    </span>

                </a>


            </nav>



            <!-- =============================================
                 INFORMACIÓN ADMINISTRADOR
                 ============================================= -->

            <div class="sidebar-footer">


                <div class="admin-profile">


                    <div class="admin-avatar">
                        A
                    </div>


                    <div class="admin-profile-info">

                        <strong>
                            Administrador
                        </strong>

                        <span>
                            admin@tucancha.com
                        </span>

                    </div>


                </div>



                <!-- Cerrar sesión -->

                <button
                    type="button"
                    class="btn-logout"
                    id="btnLogout"
                >

                    <i class="bi bi-box-arrow-right"></i>

                    <span>
                        Cerrar sesión
                    </span>

                </button>


            </div>


        </aside>



        <!-- =================================================
             CONTENIDO PRINCIPAL
             ================================================= -->

        <main class="admin-main">


            <!--

                - Saludo al administrador
                - Fecha
                - Banner de bienvenida
                - Sección "Secciones disponibles"
                - Card de Solicitudes
            -->


        </main>


    </div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>


</body>

</html>
