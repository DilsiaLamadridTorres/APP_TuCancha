<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="TuCancha - ¡Arma tu parche y juégatela!" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Degradado de la marca: rojo-naranja → naranja → amarillo oliva -->
    <linearGradient id="pinGrad" gradientUnits="userSpaceOnUse" x1="12" y1="60" x2="88" y2="60">
      <stop offset="0" stop-color="#ff4f22"/>
      <stop offset="0.5" stop-color="#f7902f"/>
      <stop offset="1" stop-color="#c7bd3b"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4f22" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f7902f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c7bd3b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5f25" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff5f25" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="reveal">
      <rect x="325" y="180" height="42" width="0">
        <animate attributeName="width" values="0;480;480;0" keyTimes="0;0.35;0.9;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Fondo de la marca -->
  <rect width="900" height="320" fill="#212529"/>

  <!-- Líneas de cancha muy tenues -->
  <g fill="none" stroke="#ffffff" stroke-width="3" opacity="0.05">
    <rect x="30" y="24" width="840" height="272" rx="8"/>
    <line x1="450" y1="24" x2="450" y2="296"/>
    <circle cx="450" cy="160" r="60"/>
    <rect x="30" y="100" width="100" height="120"/>
    <rect x="770" y="100" width="100" height="120"/>
  </g>

  <!-- Resplandor detrás del logo -->
  <circle cx="235" cy="135" r="160" fill="url(#glow)"/>

  <!-- Etiqueta superior -->
  <text x="450" y="52" text-anchor="middle" fill="#f7902f" font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" opacity="0">
    PLATAFORMA DE RESERVAS DEPORTIVAS
    <animate attributeName="opacity" values="0;0.9" dur="1s" begin="0.6s" fill="freeze"/>
  </text>

  <!-- Logo: pin de ubicación con cancha -->
  <g transform="translate(170 70) scale(1.3)">
    <!-- Onda que sale de la punta del pin -->
    <ellipse cx="50" cy="112" rx="0" ry="0" fill="none" stroke="#f7902f" stroke-width="1.5" opacity="0">
      <animate attributeName="rx" values="0;34" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="0;8" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </ellipse>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -70;0 6;0 0" keyTimes="0;0.6;1" dur="1s" fill="freeze"/>
      <!-- Contorno del pin (con la abertura arriba a la derecha, como el logo) -->
      <path d="M 83.55 28.16 A 38 38 0 0 1 80.6 68.6 L 50 110 L 19.4 68.6 A 38 38 0 0 1 76.4 18.67"
            fill="none" stroke="url(#pinGrad)" stroke-width="8" stroke-linejoin="miter"/>
      <!-- Cancha dentro del pin -->
      <g fill="none" stroke="#cfcac2" stroke-width="1.4" stroke-linecap="round">
        <line x1="27" y1="30" x2="75" y2="30"/>
        <line x1="27" y1="66" x2="75" y2="66"/>
        <line x1="51" y1="30" x2="51" y2="66"/>
        <circle cx="51" cy="48" r="6"/>
        <rect x="27" y="37" width="11.5" height="22"/>
        <rect x="63.5" y="37" width="11.5" height="22"/>
        <path d="M38.5 44 A4 4 0 0 1 38.5 52"/>
        <path d="M63.5 44 A4 4 0 0 0 63.5 52"/>
      </g>
    </g>
  </g>

  <!-- Título -->
  <text x="330" y="168" fill="#ffffff" font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" textLength="400" lengthAdjust="spacingAndGlyphs" opacity="0">
    TuCancha
    <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="40 0;0 0" dur="0.9s" begin="0.4s" fill="freeze"/>
  </text>

  <!-- Eslogan con efecto de escritura -->
  <g clip-path="url(#reveal)">
    <text x="332" y="208" fill="#9ca3ae" font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-style="italic" textLength="392" lengthAdjust="spacing">¡Arma tu parche y juégatela!</text>
  </g>

  <!-- Línea de suelo -->
  <rect x="0" y="293" width="900" height="2.5" fill="url(#groundGrad)"/>

  <!-- Balón rodando -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-60 0;960 0" dur="8s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="295" rx="14" ry="3" fill="#000" opacity="0.35"/>
    <g transform="translate(0 278)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;3600" dur="8s" repeatCount="indefinite"/>
        <circle r="16" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
        <polygon points="0,-5.8 5.5,-1.8 3.4,4.7 -3.4,4.7 -5.5,-1.8" fill="#111111"/>
        <g stroke="#111111" stroke-width="1.6" stroke-linecap="round">
          <line x1="0" y1="-5.8" x2="0" y2="-16"/>
          <line x1="5.5" y1="-1.8" x2="15.2" y2="-5"/>
          <line x1="3.4" y1="4.7" x2="9.4" y2="12.9"/>
          <line x1="-3.4" y1="4.7" x2="-9.4" y2="12.9"/>
          <line x1="-5.5" y1="-1.8" x2="-15.2" y2="-5"/>
        </g>
      </g>
    </g>
  </g>
</svg>
