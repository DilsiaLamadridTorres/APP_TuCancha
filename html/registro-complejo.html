<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Complejo</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/registro-complejo.css">

</head>

<body>
    <!-- Encargado: Miguel -->
    <main class="registration container-fluid">

        <div class="row min-vh-100">

            <!-- sidebar -->
            <aside class="col-md-3 col-lg-2 registration-sidebar">

                <!-- encabezado sidebar -->

                <div class="sidebar-header">
                    <h1>REGISTRO COMPLEJO REPORTIVO</h1>

                    <p>Progreso de carga</p>
                </div>

                <!-- bloque de progreso -->

                <div class="progress-info">

                    <div class="progress">
                        <div class="progress-bar" style="width: 25%;"></div>
                    </div>

                    <span>25%</span>

                </div>


                <nav class="form-steps">

                    <button class="step active" type="button">
                        Organización
                    </button>

                    <button class="step" type="button">
                        Complejo
                    </button>

                    <button class="step" type="button">
                        Canchas
                    </button>

                    <button class="step" type="button">
                        Revisión
                    </button>

                </nav>

                <!-- Pie del sidebar -->
                <div class="sidebar-footer">
                    <!-- Boton para reiniciar el formulario -->

                    <button type="button" class="btn-outline-secondary">
                        Empezar de nuevo
                    </button>

                </div>




            </aside>

            <!-- Contenido -->
            <section class="col-md-9 col-lg-10 registration-content">
                <!-- Encabezado del paso actual -->
                <div class="step-header">


                    <!-- Indica en qué paso del proceso nos encontramos -->
                    <span class="step-indicator">PASO 1 DE 4</span>

                    <!-- Título principal del paso -->
                    <h2>Datos del titular</h2>

                    <!-- Explicación de la información que debe ingresar el usuario -->
                    <p>
                        Completá la información del titular del complejo deportivo.
                    </p>


                </div>


                <!-- Formulario del paso actual -->
                <div class="step-form">

                    <!-- Campo para el nombre del titular -->
                    <div class="form-floating mb-4">

                        <input type="text" , class="form-control" , id="nombreTitular" ,
                            placeholder="Nombre y apellido">

                        <label for="nombreTitular">
                            Nombre y Apellido del titular
                        </label>

                    </div>


                    <!-- Campo para el teléfono -->
                    <div class="phone-field mb-4">

                        <!-- Campo para el teléfono -->
                        <div class="phone-field mb-4">

                            <!-- Código del país -->
                            <div class="country-code">
                                +57
                            </div>

                            <!-- Número de teléfono -->
                            <input type="tel" class="form-control" id="telefonoTitular"
                                placeholder="Número de teléfono">

                        </div>

                    </div>

                    <!-- Campo para el correo electrónico -->
                    <div class="form-floating mb-4">

                        <input type="email" class="form-control" id="correoTitular" placeholder="Correo electrónico">

                        <label for="correoTitular">
                            Correo electrónico
                        </label>

                    </div>

                </div>

                <!-- Contenedor de las acciones del formulario -->
                <div class="form-actions">

                    <!-- Botón para avanzar al siguiente paso -->
                    <button type="button" class="btn btn-continue">
                        Continuar
                        <span>→</span>
                    </button>

                </div>



            </section>

        </div>

    </main>

</body>

</html>
