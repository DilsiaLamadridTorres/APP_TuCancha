<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Cancha | TuCancha</title>
    <link class="icono" rel="icon" type="image/png" href="../img/logo/logo corto.png">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


    <!-- css general -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/bootstrap-custom.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/animation.css">
</head>

<body>

    <header>
        <!-- NAVBAR - SEBASTIAN -->
        <mi-navbar></mi-navbar>
    </header>

    <main class="venue-page">

        <!-- =====================================================
             BREADCRUMB
             ===================================================== -->

        <section class="venue-container">

            <nav class="venue-breadcrumb" aria-label="breadcrumb">

                <a href="canchas.html">
                    Canchas
                </a>

                <i class="bi bi-chevron-right"></i>

                <span>
                    Medellín
                </span>

                <i class="bi bi-chevron-right"></i>

                <strong>
                    Complejo Deportivo La 80
                </strong>

            </nav>

        </section>



        <!-- =====================================================
             INFORMACIÓN PRINCIPAL DEL COMPLEJO
             ===================================================== -->

        <section class="venue-container venue-header">

            <div class="venue-heading">


                <!-- Estados del complejo -->
                <div class="venue-status">

                    <span class="venue-badge verified">

                        <i class="bi bi-patch-check-fill"></i>

                        Complejo verificado

                    </span>


                    <span class="venue-badge partner">

                        <i class="bi bi-lightning-charge-fill"></i>

                        Partner TuCancha

                    </span>

                </div>



                <!-- Título -->
                <div class="venue-title-row">

                    <div>

                        <h1>
                            Complejo Deportivo La 80
                        </h1>


                        <div class="venue-rating">

                            <div class="rating-stars">

                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-half"></i>

                            </div>

                            <strong>
                                4.8
                            </strong>

                            <span>
                                (36 reseñas)
                            </span>

                        </div>

                    </div>


                    <button type="button" class="btn-share">

                        <i class="bi bi-share"></i>

                        Compartir

                    </button>

                </div>



                <!-- Dirección -->
                <div class="venue-address">

                    <i class="bi bi-geo-alt-fill"></i>

                    <span>
                        Carrera 80 # 45-20, Medellín, Antioquia
                    </span>

                </div>


            </div>

        </section>

        <!-- =====================================================
             GALERÍA DE IMÁGENES
             ===================================================== -->

        <section class="venue-container">

            <div class="venue-gallery">


                <!-- Imagen principal -->
                <div class="gallery-main">

                    <img src="../img/canchas/cancha-principal.jpg" alt="Cancha principal del complejo">

                </div>



                <!-- Imágenes secundarias -->
                <div class="gallery-secondary">


                    <div class="gallery-item">

                        <img src="../img/canchas/cancha-2.jpg" alt="Cancha deportiva">

                    </div>


                    <div class="gallery-item">

                        <img src="../img/canchas/cancha-3.jpg" alt="Instalaciones del complejo">

                    </div>


                    <div class="gallery-item">

                        <img src="../img/canchas/cancha-4.jpg" alt="Cancha iluminada">

                    </div>


                    <div class="gallery-item gallery-last">

                        <img src="../img/canchas/cancha-5.jpg" alt="Vista adicional del complejo">


                        <button type="button" class="btn-view-photos">

                            <i class="bi bi-images"></i>

                            Ver todas las fotos

                        </button>

                    </div>


                </div>


            </div>

        </section>

    </main>

    <!-- FOOTER - PAUL -->
    <footer>
        <mi-footer></mi-footer>
    </footer>
    <!-- SCRIPTS -->
    <script src="../JS/admin/navbar.js"></script>
    <script src="../JS/admin/footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
