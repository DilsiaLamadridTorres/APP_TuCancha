<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | TuCancha</title>
    <link rel="icon" type="image/png" href="../img/logo/logo corto.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/bootstrap-custom.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <header><mi-navbar></mi-navbar></header>
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="registro-title">
            <i class="bi bi-person-plus-fill auth-card__icon" aria-hidden="true"></i>
            <h1 id="registro-title">Crea tu cuenta</h1>
            <p class="auth-card__intro">Organiza tus partidos y reserva la cancha ideal para tu equipo.</p>
            <p id="connection-status" class="connection-status" role="status">Comprobando conexión…</p>
            <form id="registro-form" class="mt-4" novalidate>
                <div class="mb-3">
                    <!-- <label class="form-label" for="nombreCompleto">Nombre completo</label> -->
                    <input class="form-control" id="nombreCompleto" name="nombreCompleto" autocomplete="name" required placeholder="Nombre completo">
                    <div id="nombreCompleto-error" class="invalid-feedback"></div>
                </div>
                <div class="mb-3">
                    <!-- <label class="form-label" for="correo">Correo electrónico</label> -->
                    <input class="form-control" type="email" id="correo" name="correo" autocomplete="email" required placeholder="Correo electrónico">
                    <div id="correo-error" class="invalid-feedback"></div>
                </div>
                <div class="mb-3">
                    <!-- <label class="form-label" for="telefono">Teléfono <span class="fw-normal text-secondary">(opcional)</span></label> -->
                    <input class="form-control" placeholder="Teléfono " type="tel" id="telefono" name="telefono" autocomplete="tel">
                    <div id="telefono-error" class="invalid-feedback"></div>
                </div>
                <div class="mb-3">
                    <!-- <label class="form-label" for="contrasena">Contraseña</label> -->
                    <input class="form-control" type="password" id="contrasena" name="contrasena" autocomplete="new-password" placeholder="Contraseña" required>
                    <div class="form-text">Mínimo 8 caracteres, una letra y un número.</div>
                    <div id="contrasena-error" class="invalid-feedback"></div>
                </div>
                <div class="mb-3">
                    <!-- <label class="form-label" for="confirmarContrasena">Confirma tu contraseña</label> -->
                    <input class="form-control" type="password" id="confirmarContrasena" name="confirmarContrasena" autocomplete="new-password" placeholder="Confirma tu contraseña" required>
                    <div id="confirmarContrasena-error" class="invalid-feedback"></div>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="terminos" name="terminos">
                    <label class="form-check-label" for="terminos">Acepto los términos y condiciones.</label>
                    <div id="terminos-error" class="invalid-feedback"></div>
                </div>
                <button id="registro-submit" class="btn btn-primary w-100 py-2" type="submit">Crear cuenta</button>
                <p id="registro-status" class="auth-status" role="alert" aria-live="polite"></p>
            </form>
             <p class="auth-card__footer mt-4 mb-0">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p> 
        </section>

    </main>
    <script src="../JS/admin/navbar.js"></script>
    <script type="module" src="../JS/services/config.js"></script>
    <script type="module" src="../JS/services/api.js"></script>
    <script type="module" src="../JS/auth/registro.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
