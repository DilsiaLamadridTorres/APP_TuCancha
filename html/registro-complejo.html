<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Complejo</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


</head>

<body>
    <!-- Encargado: Miguel -->
    <main class="registration container-fluid">

        <div class="row min-vh-100">

            <!-- sidebar -->
            <aside class="col-md-3 col-lg-2 registration-sidebar">

                <!-- encabezado sidebar -->

                <div class="sidebar-header">
                    <h1>REGISTRO COMPLEJO REPORTIVO</h1>

                    <p>Progreso de carga</p>
                </div>

                <!-- bloque de progreso -->

                <div class="progress-info">

                    <div class="progress">
                        <div class="progress-bar" style="width: 25%;"></div>
                    </div>

                    <span>25%</span>

                </div>


                <nav class="form-steps">

                    <button class="step active" type="button">
                        Organización
                    </button>

                    <button class="step" type="button">
                        Complejo
                    </button>

                    <button class="step" type="button">
                        Canchas
                    </button>

                    <button class="step" type="button">
                        Revisión
                    </button>

                </nav>




            </aside>

            <!-- Contenido -->
            <section class="col-md-9 col-lg-10 registration-content">

            </section>

        </div>

    </main>

</body>

</html>
